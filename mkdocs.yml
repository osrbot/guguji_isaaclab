site_name: Guguji
site_description: Isaac Lab extension for training locomotion policies on the Guguji biped robot.
site_url: https://osrbot.github.io/guguji_isaaclab/
repo_name: GitHub
repo_url: https://github.com/osrbot/guguji_isaaclab
edit_uri: edit/main/docs/

extra:
  seo:
    keywords: Guguji, Isaac Lab, Isaac Sim, biped robot, locomotion, reinforcement learning, RSL-RL, sim-to-real
    og_image: https://raw.githubusercontent.com/osrbot/guguji_isaaclab/main/img/guguji_velocity_flat.gif
  alternate:
    - name: English
      link: /
      lang: en
    - name: 中文
      link: /zh/
      lang: zh-CN

theme:
  name: mkdocs
  language: en
  custom_dir: docs/overrides

nav:
  - Home: index.md
  - Start: getting-started.md
  - Train / Eval: training.md
  - Design: design.md
  - Envs: tested-environments.md
  - Contributors: contributors.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - fenced_code
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/polish.css

extra_javascript:
  - javascripts/extra.js
